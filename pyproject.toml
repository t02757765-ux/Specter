[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specter"
version = "1.0.0"
description = "Specter Asynchronous Reconnaissance and Deep Fingerprinting Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "mmh3>=4.0.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0"
]

[project.scripts]
specter = "specter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["specter*"]
